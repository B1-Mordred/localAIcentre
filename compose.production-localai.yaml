services:
  control-plane:
    environment:
      LOCALAI_URL: http://localai:8080

  localai:
    image: ${B1_LOCALAI_IMAGE:-b1-ai-hub/localai:v4.7.1-b1}
    build:
      context: ./deploy/localai
      network: host
      args:
        B1_LOCALAI_UPSTREAM_VERSION: ${B1_LOCALAI_UPSTREAM_VERSION:-v4.7.1-gpu-nvidia-cuda-12}
        B1_LOCALAI_UPSTREAM_COMMIT: ${B1_LOCALAI_UPSTREAM_COMMIT:-b224c96db6f4b87306a33a808650bfce63b12588}
    labels:
      b1.ai-hub.runtime: localai
      b1.ai-hub.runtime.kind: localai
      b1.ai-hub.placeholder: "false"
    read_only: false
    environment:
      B1_RUNTIME_KIND: !reset null
      B1_RUNTIME_NAME: !reset null
      B1_LOCALAI_PUBLIC_HOST: ${B1_LOCALAI_PUBLIC_HOST:-0.0.0.0}
      B1_LOCALAI_PUBLIC_PORT: ${B1_LOCALAI_PUBLIC_PORT:-8080}
      B1_LOCALAI_UPSTREAM_ADDRESS: ${B1_LOCALAI_UPSTREAM_ADDRESS:-127.0.0.1:18080}
      B1_LOCALAI_UPSTREAM_URL: ${B1_LOCALAI_UPSTREAM_URL:-http://127.0.0.1:18080}
      B1_LOCALAI_UPSTREAM_TIMEOUT_SECONDS: ${B1_LOCALAI_UPSTREAM_TIMEOUT_SECONDS:-1800}
      B1_LOCALAI_SMOKE_TIMEOUT_SECONDS: ${B1_LOCALAI_SMOKE_TIMEOUT_SECONDS:-300}
      B1_LOCALAI_HOOK_STRICT_MODEL_LIST: ${B1_LOCALAI_HOOK_STRICT_MODEL_LIST:-false}
      B1_LOCALAI_HOOK_WARM_ENABLED: ${B1_LOCALAI_HOOK_WARM_ENABLED:-false}
      B1_LOCALAI_HOOK_SMOKE_ENABLED: ${B1_LOCALAI_HOOK_SMOKE_ENABLED:-false}
      B1_RUNTIME_CONTROL_TOKEN_FILE: /run/secrets/runtime_control_token
      B1_RUNTIME_CONTROL_REQUIRE_AUTH: ${B1_RUNTIME_CONTROL_REQUIRE_AUTH:-true}
      B1_LOCALAI_CONFIG_SYNC_ENABLED: ${B1_LOCALAI_CONFIG_SYNC_ENABLED:-true}
      B1_LOCALAI_MANAGED_DEFAULT_CONTEXT_SIZE: ${B1_LOCALAI_MANAGED_DEFAULT_CONTEXT_SIZE:-2048}
      B1_LOCALAI_MANAGED_MAX_CONTEXT_SIZE: ${B1_LOCALAI_MANAGED_MAX_CONTEXT_SIZE:-2048}
      B1_LOCALAI_MANAGED_THREADS: ${B1_LOCALAI_MANAGED_THREADS:-4}
      B1_LOCALAI_MANAGED_BATCH: ${B1_LOCALAI_MANAGED_BATCH:-128}
      B1_LOCALAI_MANAGED_FIT_TARGET_MIB: ${B1_LOCALAI_MANAGED_FIT_TARGET_MIB:-1024}
      B1_LOCALAI_MANAGED_FIT_MIN_CONTEXT: ${B1_LOCALAI_MANAGED_FIT_MIN_CONTEXT:-1024}
      B1_LOCALAI_MANAGED_MEDIUM_MODEL_SIZE_GIB: ${B1_LOCALAI_MANAGED_MEDIUM_MODEL_SIZE_GIB:-2}
      B1_LOCALAI_MANAGED_LARGE_MODEL_SIZE_GIB: ${B1_LOCALAI_MANAGED_LARGE_MODEL_SIZE_GIB:-5}
      B1_LOCALAI_MANAGED_SMALL_GPU_LAYERS: ${B1_LOCALAI_MANAGED_SMALL_GPU_LAYERS:-99999999}
      B1_LOCALAI_MANAGED_MEDIUM_GPU_LAYERS: ${B1_LOCALAI_MANAGED_MEDIUM_GPU_LAYERS:-28}
      B1_LOCALAI_MANAGED_LARGE_GPU_LAYERS: ${B1_LOCALAI_MANAGED_LARGE_GPU_LAYERS:-24}
      B1_LOCALAI_MANAGED_MMAP: ${B1_LOCALAI_MANAGED_MMAP:-true}
      B1_LOCALAI_MANAGED_MMLOCK: ${B1_LOCALAI_MANAGED_MMLOCK:-false}
      B1_LOCALAI_MANAGED_LOW_VRAM: ${B1_LOCALAI_MANAGED_LOW_VRAM:-true}
      B1_LOCALAI_MANAGED_F16: ${B1_LOCALAI_MANAGED_F16:-true}
      B1_LOCALAI_VIDEO_SMOKE_ENABLED: ${B1_LOCALAI_VIDEO_SMOKE_ENABLED:-false}
      B1_LOCALAI_SMOKE_MAX_TOKENS: ${B1_LOCALAI_SMOKE_MAX_TOKENS:-1}
      B1_LOCALAI_SMOKE_IMAGE_SIZE: ${B1_LOCALAI_SMOKE_IMAGE_SIZE:-64x64}
      DEBUG: ${B1_LOCALAI_DEBUG:-false}
      LOCALAI_CORS: ${B1_LOCALAI_CORS:-false}
      LOCALAI_DISABLE_WEBUI: ${B1_LOCALAI_DISABLE_WEBUI:-true}
      LOCALAI_ADDRESS: ${B1_LOCALAI_UPSTREAM_ADDRESS:-127.0.0.1:18080}
      LOCALAI_MODELS_PATH: /srv/b1-ai-hub/models
      LOCALAI_MODELS_CONFIG_FILE: /srv/b1-ai-hub/localai/configuration/b1-managed-models.yaml
      LOCALAI_BACKENDS_PATH: /srv/b1-ai-hub/localai/backends
      LOCALAI_BACKENDS_SYSTEM_PATH: /opt/b1/localai/backends
      LOCALAI_CONFIG_DIR: /srv/b1-ai-hub/localai/configuration
      LOCALAI_DATA_PATH: /srv/b1-ai-hub/localai/data
      LOCALAI_MAX_ACTIVE_BACKENDS: ${B1_LOCALAI_MAX_ACTIVE_BACKENDS:-1}
      LOCALAI_WATCHDOG_IDLE: ${B1_LOCALAI_WATCHDOG_IDLE:-true}
      LOCALAI_WATCHDOG_IDLE_TIMEOUT: ${B1_LOCALAI_WATCHDOG_IDLE_TIMEOUT:-5m}
      LOCALAI_WATCHDOG_INTERVAL: ${B1_LOCALAI_WATCHDOG_INTERVAL:-1s}
      LOCALAI_FORCE_EVICTION_WHEN_BUSY: ${B1_LOCALAI_FORCE_EVICTION_WHEN_BUSY:-false}
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/models/runtime-views/localai:/srv/b1-ai-hub/models:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/localai/backends:/srv/b1-ai-hub/localai/backends
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/localai/configuration:/srv/b1-ai-hub/localai/configuration
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/localai/data:/srv/b1-ai-hub/localai/data
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/cache/localai:/srv/b1-ai-hub/cache
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/readyz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60m
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${B1_LOCALAI_GPU_DRIVER:-nvidia}
              count: ${B1_LOCALAI_GPU_COUNT:-1}
              capabilities: [gpu]
