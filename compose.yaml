      - app
      - runtime
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-m", "app.healthcheck"]

  tool-search:
    image: searxng/searxng@sha256:5d6d903ab82afa56ee32792d477f36bc63d3e5ca04fcb6947e28a5cfd987fad3
    <<: *service-defaults
    read_only: true
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - app
      - egress
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Firecrawl is reachable only from the private application network. Its
  # browser and HTTP fetchers have no direct default route: all external
  # traffic is forced through tool-web-egress, whose destination ACL rejects
  # loopback, link-local, Docker, LAN, tailnet, and other non-public ranges.
  tool-firecrawl:
    image: ghcr.io/firecrawl/firecrawl@sha256:1b9a8c673f4adf174f01ed377f434a09881af2e37a4f3a6fe5e1c8938c049c09
    <<: *service-defaults
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://tool-firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://tool-firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://tool-firecrawl-playwright:3000/scrape
      POSTGRES_HOST: tool-firecrawl-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${B1_FIRECRAWL_POSTGRES_PASSWORD:?set B1_FIRECRAWL_POSTGRES_PASSWORD}
      NUQ_RABBITMQ_URL: amqp://tool-firecrawl-rabbitmq:5672
      PROXY_SERVER: http://tool-web-egress:3128
      # Firecrawl sees the mandatory proxy's internal address as its peer.
      # Destination safety is enforced after proxy-side DNS resolution by the
      # Squid ACL; Firecrawl itself has no network path around that proxy.
      ALLOW_LOCAL_WEBHOOKS: "true"
      NUM_WORKERS_PER_QUEUE: "1"
      CRAWL_CONCURRENT_REQUESTS: "2"
      MAX_CONCURRENT_JOBS: "2"
      BROWSER_POOL_SIZE: "1"
      LOGGING_LEVEL: INFO
    command: ["node", "dist/src/harness.js", "--start-docker"]
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    networks:
      - app
      - web-fetch
    depends_on:
      tool-firecrawl-postgres:
        condition: service_healthy
      tool-firecrawl-redis:
        condition: service_healthy
      tool-firecrawl-rabbitmq:
        condition: service_healthy
      tool-firecrawl-playwright:
        condition: service_healthy
      tool-web-egress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3002/v0/health/readiness >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s

  tool-firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service@sha256:150da5ef39e3aebc322c25f968506ea288042e3b4a5214ae38c18b58a3e941be
    restart: unless-stopped
    user: node
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      PORT: "3000"
      PROXY_SERVER: http://tool-web-egress:3128
      ALLOW_LOCAL_WEBHOOKS: "true"
      BLOCK_MEDIA: "true"
      MAX_CONCURRENT_PAGES: "2"
    command: ["node", "dist/api.js"]
    cpus: 1.5
    mem_limit: 2G
    memswap_limit: 2G
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
      - /home/node/.cache:size=512m,uid=1000,gid=1000,mode=0750,noexec,nosuid,nodev
    networks:
      - web-fetch
    depends_on:
      tool-web-egress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  tool-firecrawl-redis:
    image: redis:8.2.1-alpine@sha256:f887e6dacdcfa8e14af2f625fdf4474ff8c37dc36ce13b9e89e6e9a901f155ad
    <<: *service-defaults
    read_only: true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - web-fetch
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  tool-firecrawl-rabbitmq:
    image: rabbitmq:4.1.3-alpine@sha256:b529562dde42f1993a0013da03158bc8f6727582e6dd132f41ef218c94aaecd8
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit disk_free_limit 2147483648
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/firecrawl/rabbitmq:/var/lib/rabbitmq
    networks:
      - web-fetch
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s

  tool-firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:4ca6718b2cef40404b046db5cd37ae45db3e44d1a5750c80522f3587a5b193d5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${B1_FIRECRAWL_POSTGRES_PASSWORD:?set B1_FIRECRAWL_POSTGRES_PASSWORD}
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/firecrawl/postgres:/var/lib/postgresql/data
    networks:
      - web-fetch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  tool-web-egress:
    image: ubuntu/squid:6.13-25.04_beta@sha256:7e2987a8a2717fca698b76777c7ef286ef256b3cf9f3ce8b3f45b6b4306105bd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    read_only: true
    volumes:
      - ./deploy/firecrawl/squid.conf:/etc/squid/squid.conf:ro
    tmpfs:
      - /run:size=16m,nosuid,nodev
      - /var/log/squid:size=32m,uid=13,gid=13,mode=0750,noexec,nosuid,nodev
      - /var/spool/squid:size=32m,uid=13,gid=13,mode=0750,noexec,nosuid,nodev
    networks:
      - web-fetch
      - egress
    healthcheck:
      test: ["CMD-SHELL", "squid -k parse -f /etc/squid/squid.conf >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

