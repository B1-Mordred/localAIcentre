    environment:
      B1_ARTIFACT_ROOT: /srv/b1-ai-hub/artifacts
      B1_MODEL_BLOB_ROOT: /srv/b1-ai-hub/models/blobs
      B1_ARTIFACT_SERVER_TOKEN_FILE: /run/secrets/artifact_server_token
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/artifacts:/srv/b1-ai-hub/artifacts:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/models/blobs:/srv/b1-ai-hub/models/blobs:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/secrets:/run/secrets:ro
    networks:
      - app
      - data
    healthcheck:
      <<: *python-health
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\nPY"]

  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-b1_ai_hub}
      POSTGRES_USER: ${POSTGRES_USER:-b1_ai_hub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/secrets:/run/secrets:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.5-bookworm@sha256:90e7a336d044f1abc9e9dbc05d65566850896d11453bbd1dd0fb7e5059f0e8fb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  runtime:
    internal: true
  web-fetch:
    internal: true
  egress: {}
