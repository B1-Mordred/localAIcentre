    gpus: all
    group_add:
      - "${B1_DOCKER_GID:-0}"
    environment:
      B1_ALLOWED_SERVICES: control-plane,localai,comfyui,voicebox,lipsync,audio-cpu,artifact-server,open-webui,gateway
      B1_RUNTIME_ACTION_SERVICES: ${B1_RUNTIME_ACTION_SERVICES:-localai,comfyui,voicebox,lipsync,audio-cpu}
      B1_ENABLE_MUTATIONS: ${B1_ENABLE_MUTATIONS:-false}
      B1_RUNTIME_AGENT_MUTATION_RATE_LIMIT_PER_MINUTE: ${B1_RUNTIME_AGENT_MUTATION_RATE_LIMIT_PER_MINUTE:-12}
      B1_RUNTIME_AGENT_TOKEN_FILE: /run/secrets/runtime_agent_token
      B1_RUNTIME_AGENT_ALLOW_MISSING_AUTH: ${B1_RUNTIME_AGENT_ALLOW_MISSING_AUTH:-false}
      B1_RUNTIME_AGENT_MTLS_ENABLED: ${B1_RUNTIME_AGENT_MTLS_ENABLED:-true}
      B1_RUNTIME_AGENT_TLS_CERT_FILE: /run/secrets/runtime_agent_server.crt
      B1_RUNTIME_AGENT_TLS_KEY_FILE: /run/secrets/runtime_agent_server.key
      B1_RUNTIME_AGENT_TLS_CA_FILE: /run/secrets/runtime_agent_mtls_ca.crt
      B1_RUNTIME_AGENT_CLIENT_CERT_FILE: /run/secrets/runtime_agent_client.crt
      B1_RUNTIME_AGENT_CLIENT_KEY_FILE: /run/secrets/runtime_agent_client.key
      B1_RUNTIME_AGENT_CLIENT_CERT_REQUIRED: ${B1_RUNTIME_AGENT_CLIENT_CERT_REQUIRED:-true}
      NVIDIA_VISIBLE_DEVICES: ${B1_RUNTIME_AGENT_NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${B1_RUNTIME_AGENT_NVIDIA_DRIVER_CAPABILITIES:-utility}
      B1_COMPOSE_PROJECT: ${B1_PROJECT_NAME:-b1-ai-hub}
      B1_METRIC_PATHS: /srv/b1-ai-hub,/tmp
      B1_ROLLBACK_SERVICES: ${B1_ROLLBACK_SERVICES:-localai,comfyui,voicebox,lipsync,audio-cpu,artifact-server,open-webui,gateway}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}:/srv/b1-ai-hub:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/secrets:/run/secrets:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/logs/runtime-agent:/srv/b1-ai-hub/logs
