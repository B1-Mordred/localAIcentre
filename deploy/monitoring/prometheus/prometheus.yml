global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: b1-ai-hub-control-plane
    scheme: http
    metrics_path: /admin/metrics.prometheus
    params:
      limit:
        - "500"
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_scrape_token
    static_configs:
      - targets:
          - control-plane:8000
