services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    profiles:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${B1_CONTAINER_APP_UID:-999}:${B1_CONTAINER_APP_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${B1_PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${B1_PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/prometheus:/prometheus
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/secrets/prometheus_scrape_token:/run/secrets/prometheus_scrape_token:ro
    networks:
      - app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    restart: unless-stopped
    profiles:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${B1_CONTAINER_APP_UID:-999}:${B1_CONTAINER_APP_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_DOMAIN: ${B1_HOST_MONITORING:-monitoring.ai.b1.germering}
      GF_SERVER_ROOT_URL: https://${B1_HOST_MONITORING:-monitoring.ai.b1.germering}/
      GF_SECURITY_ADMIN_USER: ${B1_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/lib/grafana/logs
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/data/grafana:/var/lib/grafana
      - ${B1_DATA_ROOT:-/srv/b1-ai-hub}/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
